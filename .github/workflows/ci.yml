name: CI

on:
  push:
    branches: [master, main, v3, v4]
  pull_request:
    branches: [master, main, v3, v4]

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.module }} (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - '.'
          - 'driver/postgres'
          - 'driver/mysql'
          - 'driver/sqlserver'
          - 'driver/sqlite'
          - 'driver/all'
          - 'example'
        go: ['1.25.x', 'stable']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Verify formatting
        working-directory: ${{ matrix.module }}
        run: |
          unformatted=$(gofmt -l . || true)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test with race detector
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ strategy.job-index }}
          path: ${{ matrix.module }}/coverage.out
          if-no-files-found: warn

  slim-deps:
    name: Core dependency slimming
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: Verify core + single driver does not pull other backends
        run: |
          workdir=$(mktemp -d)
          cd "$workdir"
          go mod init slimprobe
          cat > main.go <<'EOF'
          package main

          import (
          	_ "github.com/Golang-Tools/sqlhelper/driver/postgres/v4"
          	"github.com/Golang-Tools/sqlhelper/v4/bunproxy"
          )

          func main() {
          	_ = bunproxy.RegisteredSchemes()
          }
          EOF
          go mod edit \
            -replace=github.com/Golang-Tools/sqlhelper/v4=$GITHUB_WORKSPACE \
            -replace=github.com/Golang-Tools/sqlhelper/driver/postgres/v4=$GITHUB_WORKSPACE/driver/postgres
          go mod tidy
          go build ./...
          echo "--- 依赖列表 ---"
          go list -m all
          if go list -m all | grep -qE 'modernc\.org|go-mssqldb|go-sql-driver|sqliteshim|mattn/go-sqlite3'; then
            echo "只引入 postgres 驱动时不应出现其它后端的依赖"
            exit 1
          fi
          echo "依赖瘦身校验通过"

  integration:
    name: Integration (real databases)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sqlhelper
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sqlhelper
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Your_password123
        ports:
          - 1433:1433
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: Run integration tests against real databases
        working-directory: driver/all
        env:
          SQLHELPER_TEST_SQLITE_URL: sqlite:///tmp/sqlhelper_it.db
          SQLHELPER_TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/sqlhelper?charset=utf8mb4
          SQLHELPER_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/sqlhelper?sslmode=disable
          SQLHELPER_TEST_SQLSERVER_URL: sqlserver://sa:Your_password123@127.0.0.1:1433?database=master
        run: go test -race -count=1 -v -run 'TestIntegration' ./...

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: Run benchmarks
        run: go test -bench=. -benchmem -run=^$ ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # 静态检查作为信息项输出,不阻塞构建
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    # 漏洞库数据波动较大,这里只做信息项提示
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          for module in . driver/postgres driver/mysql driver/sqlserver driver/sqlite driver/all example; do
            echo "=== $module ==="
            (cd "$module" && govulncheck ./...)
          done
